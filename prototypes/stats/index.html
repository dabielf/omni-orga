<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Stats · Omni-orga prototype</title>
<!--
  Throwaway prototype for wayfinder ticket #13 (Shape positive Stats feedback).
  Question: how should Stats show how many times each repeatable task was completed
  over a chosen period, and what else belongs on the screen, while staying factual
  and positive (no scores, streaks, badges, praise, or blame)?

  Three variants, switchable with ?variant= (or the arrow keys / bottom pill), one static route:
    A — Counts list     (one row per repeatable, count plus a quiet relative bar)
    B — Day history     (per repeatable, a day grid of the chosen period; the count emerges from the pattern)
    C — By goal         (stats nested under goals: ongoing progress, repeatable counts, one-shot progress)

  Period is real URL state (period=30|90|365), shared across variants, so reload and Back work.
  Scene: a tired user at home in daylight, looking back at what actually got done without judgment.
  Run: python3 -m http.server 8149 --bind 127.0.0.1 --directory prototypes/stats
  Open: http://127.0.0.1:8149/?variant=A
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --surface: oklch(0.99 0.003 155);
  --panel: oklch(0.962 0.007 155);
  --border: oklch(0.908 0.012 155);
  --border-strong: oklch(0.84 0.018 155);
  --text: oklch(0.29 0.02 155);
  --text-2: oklch(0.50 0.02 155);
  --mint: #b8e2c8;
  --mint-soft: oklch(0.955 0.03 155);
  --mint-edge: oklch(0.72 0.06 155);
  --mint-strong: oklch(0.62 0.09 155);
  --action: oklch(0.46 0.095 155);
  --track: oklch(0.93 0.01 155);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  font-family: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
::focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

/* ---------- shell ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 208px; flex: 0 0 auto;
  background: var(--panel); border-right: 1px solid var(--border);
  padding: 20px 12px;
}
.app-name { font-size: 13px; font-weight: 600; color: var(--text-2); padding: 0 12px 14px; }
.sidebar nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar nav a {
  display: block; padding: 7px 12px; border-radius: 6px;
  color: var(--text-2); text-decoration: none; font-weight: 500;
}
.sidebar nav a:hover { background: var(--surface); color: var(--text); }
.sidebar nav a[aria-current="page"] { background: var(--mint-soft); color: var(--text); }
main { flex: 1; min-width: 0; }
.content { max-width: 820px; padding: 28px 36px 120px; }
.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.topbar h1 { font-size: 20px; font-weight: 600; margin: 0 auto 0 0; }
.status { min-height: 22px; margin: 2px 0 14px; font-size: 13px; color: var(--text-2); }
.segmented {
  display: inline-flex; background: var(--panel);
  border: 1px solid var(--border); border-radius: 7px; padding: 2px;
}
.segmented button { padding: 4px 12px; border-radius: 5px; font-size: 13px; color: var(--text-2); }
.segmented button[aria-pressed="true"] {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); box-shadow: 0 1px 2px oklch(0.3 0.02 155 / 0.08);
  margin: -1px;
}

/* ---------- shared rows ---------- */
.section { margin-top: 26px; }
.section-label {
  font-size: 11.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.04em;
  margin: 0 0 6px; font-weight: 500;
}
.slist { list-style: none; margin: 0; padding: 0; }
.slist > li { border-bottom: 1px solid var(--border); }
.slist > li:last-child { border-bottom: 0; }
.srow { display: flex; align-items: center; gap: 10px; padding: 11px 8px; }
.srow:hover { background: var(--panel); border-radius: 6px; }
.s-name { font-size: 14.5px; }
.goal-tag { color: var(--text-2); font-size: 12.5px; }
.count-txt { font-size: 14px; font-weight: 500; white-space: nowrap; }
.sub-txt { color: var(--text-2); font-size: 12.5px; white-space: nowrap; }
.bar-track { flex: 1; min-width: 60px; height: 5px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--mint-edge); border-radius: 3px; }
.empty-note { color: var(--text-2); font-size: 13px; padding: 10px 8px; }

/* ---------- B: day grid ---------- */
.rep-block { padding: 14px 8px; border-bottom: 1px solid var(--border); }
.rep-block:last-child { border-bottom: 0; }
.rep-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.daygrid-wrap { display: flex; align-items: flex-start; gap: 10px; }
.wd-axis {
  display: grid; grid-template-rows: repeat(7, 10px); gap: 2px;
  font-size: 9.5px; color: var(--text-2); width: 14px; flex: 0 0 auto;
  padding-top: 0;
}
.wd-axis span { display: flex; align-items: center; }
.daygrid {
  display: grid; grid-template-rows: repeat(7, 10px); grid-auto-flow: column;
  grid-auto-columns: 10px; gap: 2px;
}
.daygrid .cell { width: 10px; height: 10px; border-radius: 2.5px; background: oklch(0.975 0.004 155); }
.daygrid .cell.c1 { background: var(--mint); }
.daygrid .cell.c2 { background: var(--mint-strong); }
.grid-legend { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); margin-top: 8px; }
.grid-legend .cell { width: 10px; height: 10px; border-radius: 2.5px; display: inline-block; }

/* ---------- C: by goal ---------- */
.goal-block { padding: 14px 8px; border-bottom: 1px solid var(--border); }
.goal-block:last-child { border-bottom: 0; }
.goal-head { display: flex; align-items: baseline; gap: 10px; }
.goal-name { font-size: 15px; font-weight: 600; }
.type-chip {
  font-size: 11.5px; color: var(--text-2);
  border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px;
}
.goal-sub { color: var(--text-2); font-size: 12.5px; margin: 2px 0 6px; }
.rep-rows { margin: 4px 0 0 16px; }
.rep-rows .srow { padding: 8px 8px; border-bottom: 1px solid var(--border); }
.rep-rows .srow:last-child { border-bottom: 0; }
.rep-rows .s-name { font-size: 13.5px; font-weight: 400; }
.done-list { margin: 6px 0 0 16px; }
.done-item { color: var(--text-2); font-size: 13px; padding: 4px 8px; }

/* ---------- prototype switcher (not part of the design) ---------- */
.proto-bar {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60;
  display: flex; align-items: center; gap: 2px;
  background: oklch(0.24 0.02 155); color: white;
  border-radius: 999px; padding: 5px 8px;
  box-shadow: 0 8px 24px oklch(0.3 0.02 155 / 0.3);
  border: 1px solid oklch(0.4 0.02 155);
}
.proto-bar button { color: white; display: inline-flex; padding: 5px 9px; border-radius: 999px; }
.proto-bar button:hover { background: oklch(0.36 0.02 155); }
.proto-bar .label { font-size: 12.5px; padding: 0 8px; color: oklch(0.95 0.01 155); white-space: nowrap; }
.err-banner {
  position: fixed; left: 12px; top: 12px; z-index: 99;
  background: oklch(0.45 0.11 35); color: white; border-radius: 8px;
  padding: 10px 14px; font-size: 12.5px; max-width: 480px;
  font-family: ui-monospace, monospace;
}
.summary {
  display: flex; align-items: flex-end; gap: 40px;
  padding: 18px 8px 16px;
}
.sum-n { display: block; font-size: 30px; font-weight: 500; line-height: 1.1; }
.sum-l { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
@media (max-width: 900px) {
  .sidebar { display: none; }
  .content { padding: 20px 20px 120px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="app-name">Omni-orga</div>
    <nav>
      <a href="#">Dashboard</a>
      <a href="#">Goals</a>
      <a href="#">Tasks</a>
      <a href="#">Calendar</a>
      <a href="#" aria-current="page">Stats</a>
    </nav>
  </aside>
  <main>
    <div class="content">
      <div class="topbar">
        <h1>Stats</h1>
        <div class="segmented" id="period-seg" role="group" aria-label="Period">
          <button data-period="30" aria-pressed="true">30 days</button>
          <button data-period="90" aria-pressed="false">90 days</button>
          <button data-period="365" aria-pressed="false">12 months</button>
        </div>
      </div>
      <p class="status" id="status" role="status"></p>
      <div class="summary" id="summary"></div>
      <div id="body"></div>
    </div>
  </main>
</div>

<div class="proto-bar" id="proto-bar">
  <button id="pb-prev" aria-label="Previous variant">&#8249;</button>
  <span class="label" id="pb-label"></span>
  <button id="pb-next" aria-label="Next variant">&#8250;</button>
</div>

<div class="err-banner" id="err-banner" hidden></div>

<script>
'use strict';
window.addEventListener('error', e => {
  const b = document.getElementById('err-banner');
  b.hidden = false;
  b.textContent = 'Prototype error: ' + e.message;
});

/* ================= stub data (in-memory, deterministic) =================
   One day is represented as an integer: 0 = today, 1 = yesterday, ...
   The real system counts completed repeatable copies from task history
   (including after a rename); the stub stands in for that query. */

const DAY = 86400000;
const today = new Date();
today.setHours(12, 0, 0, 0);
const T = today.getTime();
const dayDate = d => new Date(T - d * DAY);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(42);

function seedCopies(prob, weekday) {
  const out = [];
  for (let d = 0; d < 400; d++) {
    if (weekday !== undefined && dayDate(d).getDay() !== weekday) continue;
    if (rnd() < prob) out.push(d);
  }
  return out;
}

const goals = {
  selfcare: { id: 'g1', name: 'Self-care', type: 'ongoing', oneOffs: seedCopies(0.035) },
  work:     { id: 'g2', name: 'Professional work', type: 'ongoing', oneOffs: seedCopies(0.045) },
  house:    { id: 'g3', name: 'Move house', type: 'one-shot', total: 5, done: 2 },
  driving:  { id: 'g4', name: 'Pass driving theory', type: 'one-shot', completedOn: 46, total: 1, done: 1 },
};

const repeatables = [
  { id: 'r1', name: '20 min walk',    goal: 'selfcare', copies: seedCopies(0.62) },
  { id: 'r2', name: 'Stretch',        goal: 'selfcare', copies: seedCopies(0.28) },
  { id: 'r3', name: 'Push on GitHub', goal: 'work',     copies: seedCopies(0.44) },
  { id: 'r4', name: 'Weekly review',  goal: 'work',     copies: seedCopies(0.85, 0) },
];

/* ================= state ================= */

const P = { variant: 'A', period: 30 };

function readParams() {
  const q = new URLSearchParams(location.search);
  const v = (q.get('variant') || 'A').toUpperCase();
  if (['A', 'B', 'C'].includes(v)) P.variant = v;
  const p = parseInt(q.get('period'), 10);
  if ([30, 90, 365].includes(p)) P.period = p;
}
function pushParams() {
  const q = new URLSearchParams(location.search);
  q.set('variant', P.variant);
  q.set('period', String(P.period));
  history.replaceState(null, '', location.pathname + '?' + q);
}

/* ================= helpers ================= */

const fmtDay = t => t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtFull = t => t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

const countIn = (rep, period) => rep.copies.filter(d => d < period).length;
const avgPerWeek = (n, period) => (n / (period / 7)).toFixed(1).replace(/\.0$/, '');

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function periodLabel(period) {
  const from = dayDate(period - 1);
  return fmtFull(from) + ' to ' + fmtFull(today);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ================= variant A: counts list ================= */

function summaryStats(period) {
  const repTotal = repeatables.reduce((s, r) => s + countIn(r, period), 0);
  const oneOffTotal = Object.values(goals).reduce((s, g) =>
    s + (g.oneOffs ? g.oneOffs.filter(d => d < period).length : 0), 0);
  const achieved = Object.values(goals).filter(g =>
    g.type === 'one-shot' && g.completedOn !== undefined && g.completedOn < period).length;
  const worked = new Set();
  for (const r of repeatables) if (countIn(r, period) > 0) worked.add(r.goal);
  for (const [key, g] of Object.entries(goals)) {
    const hits = (g.oneOffs ? g.oneOffs.filter(d => d < period).length : 0)
      + (g.completedOn !== undefined && g.completedOn < period ? 1 : 0);
    if (hits > 0) worked.add(key);
  }
  return { tasks: repTotal + oneOffTotal, achieved, worked: worked.size };
}

const summaryEl = document.getElementById('summary');
const pl = (n, one, many) => n === 1 ? one : many;
function renderSummary() {
  const s = summaryStats(P.period);
  summaryEl.innerHTML = `
    <div class="sum"><span class="sum-n">${s.tasks}</span><span class="sum-l">${pl(s.tasks, 'task completed', 'tasks completed')}</span></div>
    <div class="sum"><span class="sum-n">${s.achieved}</span><span class="sum-l">${pl(s.achieved, 'goal completed', 'goals completed')}</span></div>
    <div class="sum"><span class="sum-n">${s.worked}</span><span class="sum-l">${pl(s.worked, 'goal worked on', 'goals worked on')}</span></div>`;
}
function renderA(el) {
  const rows = repeatables
    .map(r => ({ r, n: countIn(r, P.period) }))
    .sort((a, b) => b.n - a.n);
  const max = Math.max(...rows.map(x => x.n), 1);

  el.innerHTML = `
    <div class="section">
      <p class="section-label">Repeatable tasks, this period</p>
      <ul class="slist">
        ${rows.map(({ r, n }) => n === 0 ? `
          <li><div class="srow">
            <span class="s-name">${esc(r.name)}</span>
            <span class="goal-tag">${esc(goals[r.goal].name)}</span>
            <span class="spacer" style="flex:1"></span>
            <span class="sub-txt">0 in ${P.period} days</span>
          </div></li>` : `
          <li><div class="srow">
            <span class="s-name">${esc(r.name)}</span>
            <span class="goal-tag">${esc(goals[r.goal].name)}</span>
            <span class="bar-track" aria-hidden="true"><span class="bar-fill" style="width:${Math.round(n / max * 100)}%"></span></span>
            <span class="count-txt">${n} ${n === 1 ? 'time' : 'times'}</span>
            <span class="sub-txt">&asymp;${avgPerWeek(n, P.period)} a week</span>
          </div></li>`).join('')}
      </ul>
    </div>`;
}

/* ================= variant B: day history ================= */

function renderDayGrid(rep, period) {
  const cells = [];
  const first = dayDate(period - 1);
  // pad the first week so columns are whole weeks, Monday at the top
  let pad = (first.getDay() + 6) % 7;
  for (let i = 0; i < pad; i++) cells.push('<span class="cell" style="visibility:hidden"></span>');
  for (let d = period - 1; d >= 0; d--) {
    const n = rep.copies.filter(c => c === d).length;
    const cls = n >= 2 ? 'c2' : n === 1 ? 'c1' : '';
    const title = n === 0
      ? fmtFull(dayDate(d))
      : `${n} ${n === 1 ? 'completion' : 'completions'} on ${fmtFull(dayDate(d))}`;
    cells.push(`<span class="cell ${cls}" title="${esc(title)}"></span>`);
  }
  const trailing = (7 - (pad + period) % 7) % 7;
  for (let i = 0; i < trailing; i++) cells.push('<span class="cell" style="visibility:hidden"></span>');
  return `<div class="daygrid-wrap">
    <span class="wd-axis" aria-hidden="true">
      <span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span></span>
    </span>
    <div class="daygrid" role="img" aria-label="${esc(rep.name)}: ${countIn(rep, period)} completions between ${esc(periodLabel(period))}">${cells.join('')}</div>
  </div>`;
}

function renderB(el) {
  el.innerHTML = `
    <div class="section">
      <p class="section-label">Days with completions, this period</p>
      ${repeatables.map(r => {
        const n = countIn(r, P.period);
        return `<div class="rep-block">
          <div class="rep-head">
            <span class="s-name">${esc(r.name)}</span>
            <span class="goal-tag">${esc(goals[r.goal].name)}</span>
            <span class="spacer" style="flex:1"></span>
            <span class="count-txt">${n} ${n === 1 ? 'time' : 'times'}</span>
          </div>
          ${renderDayGrid(r, P.period)}
        </div>`;
      }).join('')}
      <div class="grid-legend" aria-hidden="true">
        <span class="cell" style="background:oklch(0.975 0.004 155);border:1px solid var(--border)"></span> none
        <span class="cell c1"></span> 1
        <span class="cell c2"></span> 2 or more
      </div>
    </div>`;
}

/* ================= variant C: by goal ================= */

function renderC(el) {
  const active = ['selfcare', 'work', 'house'];
  const blocks = active.map(gid => {
    const g = goals[gid];
    const reps = repeatables.filter(r => r.goal === gid);
    let inner = '';
    if (g.type === 'ongoing') {
      const allCopies = reps.reduce((s, r) => s + r.copies.length, 0) + g.oneOffs.length;
      inner = `
        <p class="goal-sub">${allCopies} tasks and subtasks done</p>
        ${reps.length ? `<div class="rep-rows">
          ${reps.map(r => {
            const n = countIn(r, P.period);
            return `<div class="srow">
              <span class="s-name">${esc(r.name)}</span>
              <span class="spacer" style="flex:1"></span>
              <span class="count-txt">${n} ${n === 1 ? 'time' : 'times'} in ${P.period} days</span>
              <span class="sub-txt">&asymp;${avgPerWeek(n, P.period)} a week</span>
            </div>`;
          }).join('')}
        </div>` : ''}
        <div class="done-list">
          <span class="done-item"><a href="#" style="color:var(--text-2)">See all tasks</a></span>
        </div>`;
    } else {
      inner = `
        <p class="goal-sub">${g.done} of ${g.total} tasks done</p>
        <div class="bar-track" style="max-width:220px" aria-hidden="true"><span class="bar-fill" style="width:${Math.round(g.done / g.total * 100)}%"></span></div>`;
    }
    return `<div class="goal-block">
      <div class="goal-head">
        <span class="goal-name">${esc(g.name)}</span>
        <span class="type-chip">${g.type === 'ongoing' ? 'Ongoing' : 'One-shot'}</span>
      </div>
      ${inner}
    </div>`;
  }).join('');

  const completed = Object.values(goals).filter(g => g.type === 'one-shot' && g.completedOn !== undefined && g.completedOn < P.period);
  const completedBlock = completed.length ? `
    <div class="section">
      <p class="section-label">One-shot goals completed this period</p>
      ${completed.map(g => `<div class="done-item">${esc(g.name)}, completed ${fmtDay(dayDate(g.completedOn))}</div>`).join('')}
    </div>` : '';

  el.innerHTML = `
    <div class="section">
      <p class="section-label">Goals, this period</p>
      ${blocks}
    </div>
    ${completedBlock}`;
}

/* ================= render root ================= */

const bodyEl = document.getElementById('body');
const statusEl = document.getElementById('status');

function renderAll() {
  document.querySelectorAll('#period-seg button').forEach(b =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.period) === P.period)));
  statusEl.textContent = periodLabel(P.period) + ' · counts include every completed copy, including after a rename';
  renderSummary();
  if (P.variant === 'A') renderA(bodyEl);
  else if (P.variant === 'B') renderB(bodyEl);
  else renderC(bodyEl);
  updateSwitcher();
}

/* period control (shared across variants, URL state) */
document.getElementById('period-seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-period]');
  if (!b) return;
  P.period = Number(b.dataset.period);
  pushParams();
  renderAll();
});

/* ================= prototype switcher (not part of the design) ================= */

const VARIANTS = { A: 'A · Counts list', B: 'B · Day history', C: 'C · By goal' };
function updateSwitcher() {
  document.getElementById('pb-label').textContent = VARIANTS[P.variant];
}
function cycleVariant(dir) {
  const order = ['A', 'B', 'C'];
  P.variant = order[(order.indexOf(P.variant) + dir + 3) % 3];
  pushParams();
  renderAll();
}
document.getElementById('pb-prev').addEventListener('click', () => cycleVariant(-1));
document.getElementById('pb-next').addEventListener('click', () => cycleVariant(1));
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select') || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycleVariant(-1);
  if (e.key === 'ArrowRight') cycleVariant(1);
});

readParams();
pushParams();
renderAll();
</script>
</body>
</html>
